name: Docker Publish (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN hanya diberi izin yang dibutuhkan, tidak lebih.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build dan push image ke GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # GHCR menolak nama image yang mengandung huruf besar, sedangkan
      # nama akun/repo GitHub boleh berhuruf besar. ${VAR,,} = huruf kecil.
      - name: Tentukan nama image (huruf kecil semua)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io dengan GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag memakai nomor commit supaya setiap image bisa ditelusuri
          # ke commit asalnya; "latest" hanya tambahan.
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Menghubungkan package dengan repository ini di GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan
        run: |
          echo "Image terbit:"
          echo "  ${{ steps.image.outputs.name }}:${{ github.sha }}"
          echo "  ${{ steps.image.outputs.name }}:latest"
