name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Upload vendor sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build
          path: vendor/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Download vendor artifact dari job build
        uses: actions/download-artifact@v4
        with:
          name: vendor-build
          path: vendor/

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Siapkan database SQLite sementara
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Jalankan migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Jalankan PHPUnit test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Simulasi deploy ke staging
        run: |
          echo "== Deploy ke server staging (simulasi) =="
          echo "Kode dari branch ${{ github.ref_name }} siap diuji di staging."
          echo "Tidak ada risiko terhadap pengguna nyata di tahap ini."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Simulasi deploy.sh di server produksi
        run: |
          echo "== Menjalankan deploy.sh (simulasi) =="
          echo "1 - php artisan down --retry=60        (kunci pintu, mode maintenance)"
          echo "2 - git pull origin main                 (ambil kode terbaru)"
          echo "3 - composer install --no-dev --optimize-autoloader  (pasang dependensi)"
          echo "4 - php artisan migrate --force           (ubah skema basis data)"
          echo "5 - php artisan config:cache && route:cache && view:cache  (bangun ulang cache)"
          echo "6 - php artisan queue:restart              (muat ulang pekerja antrean)"
          echo "7 - php artisan up                         (buka pintu kembali)"
          echo "== Deploy produksi (simulasi) selesai =="